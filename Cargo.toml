[package]
name = "silksong-mod-manager"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "silksong-mod-manager"
path = "launch/main.rs"

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
